<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Abe Mangona — AbeOS</title>
  <meta name="description" content="Abe Mangona — product engineer who designs, builds, and ships consumer apps. An interactive desktop portfolio." />
  <meta name="theme-color" content="#f6ecd6" />
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="assets/favicon-32.png" sizes="32x32" type="image/png" />
  <link rel="apple-touch-icon" href="assets/favicon-180.png" />
  <!-- Social preview -->
  <meta property="og:title" content="Abe Mangona — AbeOS" />
  <meta property="og:description" content="Boot into AbeOS and chat with Abe-bot. An interactive portfolio for a product engineer who ships." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://abemangona.space/" />
  <meta property="og:image" content="https://abemangona.space/assets/og.png?v=2" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="AbeOS — Abe Mangona, product engineer who builds and ships consumer apps. An interactive desktop-OS portfolio." />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Abe Mangona — AbeOS" />
  <meta name="twitter:description" content="Boot into AbeOS and chat with Abe-bot. An interactive portfolio for a product engineer who ships." />
  <meta name="twitter:image" content="https://abemangona.space/assets/og.png?v=2" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Pixelify+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="styles/reset.css" />
  <link rel="stylesheet" href="styles/boot.css" />
  <link rel="stylesheet" href="styles/desktop.css" />
  <link rel="stylesheet" href="styles/windows.css" />
  <link rel="stylesheet" href="styles/chat.css" />
  <link rel="stylesheet" href="styles/responsive.css" />
</head>
<body>
  <!-- Animated retro background (owned by background.js) -->
  <canvas id="bg-canvas" aria-hidden="true"></canvas>
  <div id="crt-overlay" aria-hidden="true"></div>

  <!-- BOOT SPLASH (owned by main.js) -->
  <div id="boot" role="dialog" aria-label="AbeOS booting">
    <div class="boot__inner">
      <div class="boot__logo">AbeOS</div>
      <div class="boot__sub">v4.8 &middot; product engineering edition</div>
      <div class="boot__bar"><div class="boot__bar-fill" id="boot-bar-fill"></div></div>
      <pre class="boot__log" id="boot-log" aria-hidden="true"></pre>
      <button class="boot__skip" id="boot-skip" type="button">skip intro &raquo;</button>
    </div>
  </div>

  <!-- DESKTOP -->
  <div id="desktop" hidden>
    <!-- Top menu bar -->
    <header id="menubar">
      <span class="menubar__brand">AbeOS&nbsp;<span class="menubar__sun">☼</span></span>
      <nav class="menubar__menus" id="menubar-menus" aria-label="Menu"></nav>
      <span class="menubar__spacer"></span>
      <button class="menubar__item" id="crt-toggle" type="button" aria-pressed="true">CRT</button>
      <button class="menubar__item menubar__cta" id="hire-cta" type="button">Hire Abe ▸</button>
      <time class="menubar__clock" id="clock" aria-live="off">--:--</time>
    </header>

    <!-- Screen: icons + windows + sticky note -->
    <main id="screen">
      <ul id="desktop-icons" aria-label="Desktop icons"><!-- generated by WM --></ul>
      <div id="windows"><!-- WM mounts windows here --></div>

      <aside id="sticky-note" tabindex="0" aria-label="Sticky note">
        <p>psst — double-click <b>💬 Chat</b> to get to know Abe.</p>
        <span class="sticky-note__pin" aria-hidden="true"></span>
      </aside>
    </main>

    <!-- Bottom dock -->
    <footer id="dock" aria-label="Dock"><!-- generated by WM --></footer>
  </div>

  <noscript>
    <div style="padding:2rem;font-family:sans-serif;color:#fff;background:#2a1a4a;min-height:100vh">
      <h1>Abe Mangona</h1>
      <p>This interactive portfolio needs JavaScript. Meanwhile: <a href="resume.pdf" style="color:#ffd36e">download my résumé (PDF)</a> or email <a href="mailto:abemangona@gmail.com" style="color:#ffd36e">abemangona@gmail.com</a>.</p>
    </div>
  </noscript>

  <!-- Scripts: classic (non-module) so the site also works via file:// — ORDER MATTERS -->
  <script src="scripts/data.js"></script>
  <script src="scripts/background.js"></script>
  <script src="scripts/wm.js"></script>
  <script src="scripts/ai.js"></script>
  <script src="scripts/chat.js"></script>
  <script src="scripts/main.js"></script>
</body>
</html>
